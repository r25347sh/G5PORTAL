name: Sync Calendar ICS

on:
  schedule:
    # every hour (UTC) — Google Calendar 変更を早く反映
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g5portal-calendar-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch ICS and write events.json
        run: |
          python3 << 'PY'
          import json, urllib.request
          from datetime import datetime, timedelta, timezone

          ICS_URL = (
              "https://calendar.google.com/calendar/ical/"
              "c_92306547d832f212203b39db04331ef15584f3b370d8d0d50317376f7723c116"
              "%40group.calendar.google.com/private-7b8b57d1a2538032e32bb0d9b5219155/basic.ics"
          )
          raw = urllib.request.urlopen(ICS_URL, timeout=60).read().decode("utf-8", errors="replace")

          lines = []
          for line in raw.splitlines():
              if line.startswith(" ") or line.startswith("\t"):
                  if lines:
                      lines[-1] += line[1:]
                  continue
              lines.append(line)

          events = []
          cur = {}

          def flush():
              global cur
              if not cur.get("summary") and not cur.get("uid"):
                  cur = {}
                  return
              start = cur.get("dtstart")
              end = cur.get("dtend")
              all_day = False
              if start and "T" not in start:
                  all_day = True
                  start = start[:8]
                  start_iso = f"{start[:4]}-{start[4:6]}-{start[6:8]}"
                  if end and "T" not in end:
                      end = end[:8]
                      end_iso = f"{end[:4]}-{end[4:6]}-{end[6:8]}"
                  else:
                      d = datetime.strptime(start, "%Y%m%d") + timedelta(days=1)
                      end_iso = d.strftime("%Y-%m-%d")
                  start_out, end_out = start_iso, end_iso
              else:
                  def to_iso(s):
                      s = s.replace("Z", "")
                      if "T" in s:
                          s = s[:15] if len(s) >= 15 else s
                          dt = datetime.strptime(s[:15], "%Y%m%dT%H%M%S")
                          return dt.isoformat() + "Z"
                      return s
                  start_out = to_iso(start) if start else None
                  end_out = to_iso(end) if end else None
              events.append({
                  "id": cur.get("uid"),
                  "title": cur.get("summary") or "(no title)",
                  "start": start_out,
                  "end": end_out,
                  "allDay": all_day,
                  "description": cur.get("description") or "",
                  "location": cur.get("location") or "",
                  "extendedProps": {
                      "description": cur.get("description") or "",
                      "location": cur.get("location") or "",
                  },
              })
              cur = {}

          for line in lines:
              if line == "BEGIN:VEVENT":
                  cur = {}
                  continue
              if line == "END:VEVENT":
                  flush()
                  continue
              if ":" not in line:
                  continue
              key, val = line.split(":", 1)
              key_base = key.split(";")[0].upper()
              if key_base == "SUMMARY":
                  cur["summary"] = val.replace("\\n", "\n").replace("\\,", ",")
              elif key_base == "DESCRIPTION":
                  cur["description"] = val.replace("\\n", "\n").replace("\\,", ",")
              elif key_base == "LOCATION":
                  cur["location"] = val.replace("\\n", "\n").replace("\\,", ",")
              elif key_base == "UID":
                  cur["uid"] = val
              elif key_base == "DTSTART":
                  cur["dtstart"] = val
              elif key_base == "DTEND":
                  cur["dtend"] = val

          events.sort(key=lambda e: e.get("start") or "")
          out = {
              "updatedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source": "G5PORTAL Google Calendar ICS",
              "events": events,
          }
          path = "pages/calendar/events.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Wrote {len(events)} events to {path}")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/calendar/events.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(calendar): sync events.json from Google ICS"
            git push
          fi
