name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: g5portal-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # GitHub-hosted Ubuntu runners に標準搭載されている Android SDK
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Capacitor dependencies
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Prepare dummy webDir and add Android platform
        run: |
          mkdir -p dummy_web
          # server.url で外部を読み込むため、ローカル資産は最小限でよい
          if [ ! -f dummy_web/index.html ]; then
            echo '<!DOCTYPE html><html><body><p>G5PORTAL</p></body></html>' > dummy_web/index.html
          fi
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: G5PORTAL-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
