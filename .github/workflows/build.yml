name: Build Native Apps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: g5portal-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Capacitor dependencies
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Prepare dummy webDir and add Android platform
        run: |
          mkdir -p dummy_web
          if [ ! -f dummy_web/index.html ]; then
            echo '<!DOCTYPE html><html><body><p>G5PORTAL</p></body></html>' > dummy_web/index.html
          fi
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          java -version
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: G5PORTAL-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios:
    name: Build iOS (Simulator)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Capacitor dependencies
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest

      - name: Prepare dummy webDir and add iOS platform (CocoaPods)
        run: |
          set -euo pipefail
          mkdir -p dummy_web
          if [ ! -f dummy_web/index.html ]; then
            echo '<!DOCTYPE html><html><body><p>G5PORTAL</p></body></html>' > dummy_web/index.html
          fi
          # Capacitor 8+ はデフォルトが SPM のため、Podfile を確実に生成する
          npx cap add ios --packagemanager CocoaPods
          npx cap sync ios
          echo "=== ios tree ==="
          find ios -maxdepth 4 \( -name Podfile -o -name "*.xcworkspace" -o -name "*.xcodeproj" \) 2>/dev/null || true

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          PODFILE=$(find ios -name Podfile -type f | head -n 1)
          if [ -z "$PODFILE" ]; then
            echo "Podfile not found under ios/"
            find ios -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          POD_DIR=$(dirname "$PODFILE")
          echo "Using Podfile at: $PODFILE"
          echo "POD_DIR=$POD_DIR" >> "$GITHUB_ENV"
          cd "$POD_DIR"
          pod install --repo-update

      - name: Build iOS Simulator app (unsigned)
        run: |
          set -euo pipefail

          # workspace / project を自動検出
          WORKSPACE=$(find ios -name "*.xcworkspace" -type d | grep -v "xcodeproj" | head -n 1 || true)
          PROJECT=$(find ios -name "*.xcodeproj" -type d | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            echo "Building workspace: $WORKSPACE"
            BUILD_ARGS=(-workspace "$WORKSPACE")
          elif [ -n "$PROJECT" ]; then
            echo "Building project: $PROJECT"
            BUILD_ARGS=(-project "$PROJECT")
          else
            echo "No Xcode workspace/project found under ios/"
            find ios -type d 2>/dev/null | head -50 || true
            exit 1
          fi

          xcodebuild \
            "${BUILD_ARGS[@]}" \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP_PATH=$(find build/ios -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "App.app not found; searching all .app bundles..."
            find build/ios -type d -name "*.app" || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p dist-ios
          cp -R "$APP_PATH" dist-ios/G5PORTAL.app
          cd dist-ios
          zip -r G5PORTAL-ios-simulator.zip G5PORTAL.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: G5PORTAL-ios
          path: |
            dist-ios/G5PORTAL.app
            dist-ios/G5PORTAL-ios-simulator.zip
          retention-days: 14
