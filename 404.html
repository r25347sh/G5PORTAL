<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <title>404 · Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #8a8a8a;
      font-family: "SF Mono", "Consolas", "Liberation Mono", Menlo, monospace;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 2rem 1.25rem;
      user-select: none;
      -webkit-user-select: none;
    }
    .code {
      font-size: clamp(3.5rem, 14vw, 6rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #c4c4c4;
      line-height: 1;
      margin-bottom: 1.25rem;
    }
    .code span {
      display: inline-block;
      cursor: default;
      padding: 0 0.05em;
      transition: color 0.15s, text-shadow 0.15s;
    }
    .code span.on {
      color: #e8e8e8;
      text-shadow: 0 0 12px rgba(200,200,200,0.35);
    }
    .msg {
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #5a5a5a;
      margin-bottom: 2.5rem;
    }
    .sub {
      font-size: 0.75rem;
      color: #3a3a3a;
      max-width: 22rem;
      text-align: center;
      line-height: 1.6;
    }
    a.back {
      margin-top: 2.75rem;
      color: #4a4a4a;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 2px;
    }
    a.back:hover { color: #7a7a7a; }
    .foot {
      position: fixed;
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: 0; right: 0;
      text-align: center;
      font-size: 0.65rem;
      color: #2a2a2a;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="code" id="code" aria-hidden="true">
    <span data-d="4">4</span><span data-d="0">0</span><span data-d="4">4</span>
  </div>
  <p class="msg">Resource not found</p>
  <p class="sub">The requested path does not exist on this server.</p>
  <a class="back" id="back" href="./">Return</a>
  <div class="foot">G⁵ · HTTP 404</div>
  <script>
  (function () {
    var need = ["4", "0", "4"];
    var step = 0;
    var timer = null;
    var spans = document.querySelectorAll("#code span");

    function reset() {
      step = 0;
      spans.forEach(function (s) { s.classList.remove("on"); });
    }

    function armTimeout() {
      clearTimeout(timer);
      timer = setTimeout(reset, 2800);
    }

    spans.forEach(function (sp) {
      sp.addEventListener("click", function (e) {
        e.preventDefault();
        var d = sp.getAttribute("data-d");
        if (d === need[step]) {
          sp.classList.add("on");
          step++;
          armTimeout();
          if (step >= need.length) {
            clearTimeout(timer);
            setTimeout(function () {
              location.href = "4O4.html";
            }, 220);
          }
        } else {
          reset();
        }
      });
    });

    var a = document.getElementById("back");
    try {
      var path = location.pathname || "";
      if (path.indexOf("/G5PORTAL") >= 0) {
        a.href = path.slice(0, path.indexOf("/G5PORTAL") + "/G5PORTAL".length) + "/";
      }
    } catch (e) {}
  })();
  </script>
</body>
</html>
