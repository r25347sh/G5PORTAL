<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#050505">
  <title>4O4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #050505;
      color: #9a9a9a;
      font-family: "SF Mono", Consolas, Menlo, monospace;
      -webkit-font-smoothing: antialiased;
    }
    .gate {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }
    .gate-code {
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 600;
      letter-spacing: 0.14em;
      color: #3a3a3a;
      margin-bottom: 1rem;
    }
    #gate-o {
      display: inline-block;
      color: #4a4a4a;
      cursor: default;
      padding: 0 0.05em;
    }
    .gate-msg {
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #2a2a2a;
    }
    .gate-hint {
      margin-top: 2rem;
      font-size: 0.9rem;
      letter-spacing: 0.35em;
      color: #2e2e2e;
      min-height: 1.2em;
    }
    .hz {
      position: fixed;
      width: 56px;
      height: 56px;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
    }
    body.hz-on .hz { pointer-events: auto; }
    .hz-tl { top: 0; left: 0; }
    .hz-tr { top: 0; right: 0; }
    .hz-bl { bottom: 0; left: 0; }
    .hz-br { bottom: 0; right: 0; }
  </style>
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-code">4<span id="gate-o">O</span>4</div>
    <p class="gate-msg">not found</p>
    <p class="gate-hint" id="gate-hint"></p>
    <div class="hz hz-tl" data-hz="0"></div>
    <div class="hz hz-tr" data-hz="1"></div>
    <div class="hz hz-bl" data-hz="2"></div>
    <div class="hz hz-br" data-hz="3"></div>
  </div>
  <script>
  (function () {
    var KEY = "__g5_pr";
    var TTL = 2 * 60 * 60 * 1000;
    var ORDER = [3, 0, 2, 1];
    var XR = "https://r25347sh.github.io/xr/";
    var gateO = document.getElementById("gate-o");
    var hint = document.getElementById("gate-hint");
    var zonesReady = false;
    var step = 0;
    var holdTimer = null;
    var holdMs = 1400;

    function unlocked() {
      try {
        var raw = sessionStorage.getItem(KEY);
        if (!raw) return false;
        var o = JSON.parse(raw);
        if (!o || !o.t || o.v !== 1) return false;
        if (Date.now() - o.t > TTL) {
          sessionStorage.removeItem(KEY);
          return false;
        }
        return true;
      } catch (e) { return false; }
    }

    function setUnlock() {
      try {
        sessionStorage.setItem(KEY, JSON.stringify({ t: Date.now(), v: 1 }));
      } catch (e) {}
    }

    function go() {
      setUnlock();
      location.replace(XR);
    }

    if (unlocked()) {
      go();
      return;
    }

    function onHoldStart(e) {
      if (zonesReady) return;
      e.preventDefault();
      holdTimer = setTimeout(function () {
        zonesReady = true;
        document.body.classList.add("hz-on");
        if (hint) hint.textContent = "·";
        step = 0;
      }, holdMs);
    }
    function onHoldEnd() { clearTimeout(holdTimer); }

    if (gateO) {
      gateO.addEventListener("mousedown", onHoldStart);
      gateO.addEventListener("touchstart", onHoldStart, { passive: false });
      gateO.addEventListener("mouseup", onHoldEnd);
      gateO.addEventListener("mouseleave", onHoldEnd);
      gateO.addEventListener("touchend", onHoldEnd);
      gateO.addEventListener("touchcancel", onHoldEnd);
    }

    var resetTimer = null;
    function resetStep() {
      step = 0;
      if (hint && zonesReady) hint.textContent = "·";
    }

    document.querySelectorAll(".hz").forEach(function (hz) {
      hz.addEventListener("click", function (e) {
        if (!zonesReady) return;
        e.preventDefault();
        e.stopPropagation();
        var id = parseInt(hz.getAttribute("data-hz"), 10);
        if (id === ORDER[step]) {
          step++;
          if (hint) hint.textContent = new Array(step + 1).join("·");
          clearTimeout(resetTimer);
          resetTimer = setTimeout(resetStep, 3200);
          if (step >= ORDER.length) {
            clearTimeout(resetTimer);
            go();
          }
        } else {
          resetStep();
        }
      });
    });
  })();
  </script>
</body>
</html>
