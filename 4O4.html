<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#050505">
  <title>4O4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%; background: #050505; color: #9a9a9a;
      font-family: "SF Mono", Consolas, Menlo, monospace;
    }
    .gate {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem;
      user-select: none; -webkit-user-select: none;
    }
    .gate-code {
      font-size: clamp(3rem, 12vw, 5rem); font-weight: 600;
      letter-spacing: 0.14em; color: #3a3a3a; margin-bottom: 1rem;
    }
    .gate-code span {
      display: inline-block; padding: 0 0.1em; cursor: pointer;
      transition: color 0.12s, text-shadow 0.12s, transform 0.12s;
    }
    .gate-code span.lit {
      color: #c8c8c8; text-shadow: 0 0 12px rgba(200,200,200,0.35);
    }
    .gate-code span:active { transform: scale(0.9); }
    .gate-msg {
      font-size: 0.75rem; letter-spacing: 0.22em;
      text-transform: uppercase; color: #2a2a2a;
    }
    .gate-hint {
      margin-top: 2rem; font-size: 0.85rem; letter-spacing: 0.3em;
      color: #2e2e2e; min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="gate">
    <div class="gate-code" id="code" aria-hidden="true">
      <span data-k="a">4</span><span data-k="o">O</span><span data-k="b">4</span>
    </div>
    <p class="gate-msg">not found</p>
    <p class="gate-hint" id="hint"></p>
  </div>
  <script>
  (function () {
    var KEY = "__g5x";
    var TTL = 2 * 60 * 60 * 1000;
    var XR = "https://r25347sh.github.io/xr/";
    var SEQ = ["o", "o", "a", "b", "o", "a", "b", "o"];
    var step = 0;
    var lock = false;
    var lastTap = 0;
    var timer = null;
    var spans = document.querySelectorAll("#code span");
    var hint = document.getElementById("hint");

    function parseTs(v) {
      var n = parseInt(String(v || ""), 10);
      return isFinite(n) && n > 0 ? n : 0;
    }
    function already() {
      try {
        var t = parseTs(sessionStorage.getItem(KEY)) || parseTs(localStorage.getItem(KEY));
        return t > 0 && (Date.now() - t) < TTL;
      } catch (e) { return false; }
    }
    function stamp() {
      var t = Date.now(), s = String(t);
      try { sessionStorage.setItem(KEY, s); } catch (e) {}
      try { localStorage.setItem(KEY, s); } catch (e) {}
      return t;
    }
    function go() {
      location.replace(XR + "?x=" + stamp());
    }
    if (already()) { go(); return; }

    function reset() {
      step = 0; lock = false;
      clearTimeout(timer);
      spans.forEach(function (s) { s.classList.remove("lit"); });
      if (hint) hint.textContent = "";
    }
    function arm() {
      clearTimeout(timer);
      timer = setTimeout(reset, 3000);
    }
    function flash(el) {
      el.classList.add("lit");
      setTimeout(function () { el.classList.remove("lit"); }, 150);
    }

    function onTap(sp) {
      if (lock) return;
      var now = Date.now();
      if (now - lastTap < 200) return;
      lastTap = now;
      var k = sp.getAttribute("data-k");
      flash(sp);

      if (k !== SEQ[step]) {
        reset();
        return;
      }
      step++;
      if (hint) hint.textContent = new Array(step + 1).join("·");
      if (step >= SEQ.length) {
        lock = true;
        clearTimeout(timer);
        setTimeout(go, 80);
        return;
      }
      arm();
    }

    spans.forEach(function (sp) {
      function fire(e) {
        e.preventDefault();
        e.stopPropagation();
        onTap(sp);
      }
      sp.addEventListener("click", fire);
      sp.addEventListener("touchend", fire, { passive: false });
    });
  })();
  </script>
</body>
</html>
