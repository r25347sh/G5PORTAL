<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#050505">
  <title>4O4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%; background: #050505; color: #9a9a9a;
      font-family: "SF Mono", Consolas, Menlo, monospace;
    }
    .gate {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem;
      user-select: none; -webkit-user-select: none;
    }
    .gate-code {
      font-size: clamp(3rem, 12vw, 5rem); font-weight: 600;
      letter-spacing: 0.14em; color: #3a3a3a; margin-bottom: 1rem;
    }
    .gate-code span {
      display: inline-block; padding: 0 0.08em; cursor: default;
      transition: color 0.12s, text-shadow 0.12s;
    }
    .gate-code span.lit {
      color: #c8c8c8; text-shadow: 0 0 10px rgba(200,200,200,0.3);
    }
    .gate-msg {
      font-size: 0.75rem; letter-spacing: 0.22em;
      text-transform: uppercase; color: #2a2a2a;
    }
    .gate-hint {
      margin-top: 2rem; font-size: 0.85rem; letter-spacing: 0.3em;
      color: #2e2e2e; min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="gate">
    <div class="gate-code" id="code" aria-hidden="true">
      <span data-k="a">4</span><span data-k="o">O</span><span data-k="b">4</span>
    </div>
    <p class="gate-msg">not found</p>
    <p class="gate-hint" id="hint"></p>
  </div>
  <script>
  (function () {
    var KEY = "__g5_pr";
    var TTL = 2 * 60 * 60 * 1000;
    var XR = "https://r25347sh.github.io/xr/";
    var phase = 0, oCount = 0, lastT = 0, phaseTimer = null;
    var spans = document.querySelectorAll("#code span");
    var hint = document.getElementById("hint");

    function already() {
      try {
        var raw = sessionStorage.getItem(KEY);
        if (!raw) return false;
        var o = JSON.parse(raw);
        return o && o.v === 1 && o.t && (Date.now() - o.t < TTL);
      } catch (e) { return false; }
    }

    function b64url(s) {
      var p = btoa(s);
      return p.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function makeToken() {
      var t = Date.now();
      var payload = JSON.stringify({ t: t, v: 1 });
      try {
        sessionStorage.setItem(KEY, payload);
      } catch (e) {}
      try {
        localStorage.setItem(KEY + "_b", payload);
      } catch (e) {}
      return b64url(payload);
    }

    function go() {
      var tok = makeToken();
      location.replace(XR + "?u=" + encodeURIComponent(tok));
    }

    if (already()) { go(); return; }

    function reset() {
      phase = 0; oCount = 0; lastT = 0;
      clearTimeout(phaseTimer);
      spans.forEach(function (s) { s.classList.remove("lit"); });
      if (hint) hint.textContent = "";
    }
    function arm(ms) {
      clearTimeout(phaseTimer);
      phaseTimer = setTimeout(reset, ms);
    }
    function flash(el) {
      el.classList.add("lit");
      setTimeout(function () { el.classList.remove("lit"); }, 180);
    }

    spans.forEach(function (sp) {
      function onTap(e) {
        e.preventDefault();
        e.stopPropagation();
        var k = sp.getAttribute("data-k");
        var now = Date.now();
        flash(sp);

        if (phase === 0) {
          if (k !== "o") { reset(); return; }
          if (oCount > 0 && now - lastT > 1200) { oCount = 0; }
          oCount++;
          lastT = now;
          if (hint) hint.textContent = new Array(oCount + 1).join("·");
          if (oCount >= 3) {
            phase = 1;
            arm(3000);
          } else {
            arm(1200);
          }
          return;
        }
        if (phase === 1) {
          if (k !== "a") { reset(); return; }
          phase = 2;
          if (hint) hint.textContent = "····";
          arm(3000);
          return;
        }
        if (phase === 2) {
          if (k !== "b") { reset(); return; }
          clearTimeout(phaseTimer);
          if (hint) hint.textContent = "·····";
          setTimeout(go, 120);
        }
      }
      sp.addEventListener("click", onTap);
      sp.addEventListener("touchend", function (e) {
        e.preventDefault();
        onTap(e);
      }, { passive: false });
    });
  })();
  </script>
</body>
</html>
