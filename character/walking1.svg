<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 128" width="100%" height="100%">
  <!-- Left Arm (Background) -->
  <g id="left-arm" transform="rotate(0, 32, 48)">
    <!-- Sleeve Base -->
    <path d="M 32 48 C 27 58, 26 68, 28 77 L 33 75 C 32 65, 33 55, 36 50 Z" fill="#2d5a27" />
    <path d="M 32 48 C 30 55, 29 62, 29 70 L 33 68 C 33 60, 34 54, 36 50 Z" fill="#1c3818" />
    <!-- Cuff -->
    <path d="M 28 77 L 33 75 L 34 78 L 29 80 Z" fill="#b8862d" />
    <!-- Hand -->
    <circle cx="31.5" cy="81" r="2.5" fill="#d99980" />
  </g>

  <!-- Left Leg (Background) -->
  <g id="left-leg" transform="rotate(0, 32, 85)">
    <!-- Trousers -->
    <path d="M 29 85 L 35 85 L 34 103 L 28 103 Z" fill="#1f232c" />
    <!-- Cuff -->
    <path d="M 27 103 L 35 103 L 34 106 L 27 106 Z" fill="#384252" />
    <!-- Boot -->
    <path d="M 27 106 L 34 106 L 34 116 L 39 122 L 26 122 Z" fill="#26160b" />
    <!-- Boot Accent -->
    <path d="M 27 114 L 35 114 L 36 115 L 26.5 115 Z" fill="#b8862d" />
  </g>

  <!-- Right Leg (Foreground) -->
  <g id="right-leg" transform="rotate(0, 32, 85)">
    <!-- Trousers -->
    <path d="M 29 85 L 35 85 L 35 103 L 29 103 Z" fill="#2c323f" />
    <path d="M 32 85 L 35 85 L 35 103 L 33 103 Z" fill="#1f232c" />
    <!-- Cuff -->
    <path d="M 28 103 L 36 103 L 36 106 L 28 106 Z" fill="#4a5568" />
    <!-- Boot -->
    <path d="M 28 106 L 36 106 L 36 116 L 41 122 L 27 122 L 27 116 Z" fill="#472b17" />
    <!-- Boot Volume/Highlight -->
    <path d="M 36 106 L 36 116 L 41 122 L 39 122 L 34 116 L 34 106 Z" fill="#5c3a21" />
    <path d="M 28 114 L 37 114 L 38 115 L 27 115 Z" fill="#d4a347" />
    <path d="M 27 122 L 41 122 L 40 124 L 28 124 Z" fill="#26160b" />
  </g>

  <!-- Torso Anchor -->
  <g id="torso">
    <!-- Inner Shadow (Covers leg joints) -->
    <path d="M 28 80 L 36 80 L 36 95 L 28 95 Z" fill="#101814" />
    
    <!-- Poncho Back Fold -->
    <path d="M 32 45 L 20 75 L 30 95 L 32 95 Z" fill="#3a7332" />
    <!-- Poncho Front Profile -->
    <path d="M 32 45 L 32 95 L 44 75 L 38 45 Z" fill="#498f3f" />
    
    <!-- Geometric Depth Folds -->
    <path d="M 32 45 L 38 75 L 32 95 Z" fill="#58a34d" />
    <path d="M 32 45 L 27 75 L 32 95 Z" fill="#2d5a27" />

    <!-- Poncho Gold Trim -->
    <path d="M 20 75 L 30 95 L 31 93 L 22 74 Z" fill="#d4a347" />
    <path d="M 44 75 L 32 95 L 33 92 L 42 74 Z" fill="#f6d365" />

    <!-- Satchel Strap -->
    <path d="M 26 45 L 29 45 L 41 72 L 38 73 Z" fill="#59341b" />
    <path d="M 27.5 45 L 29 45 L 41 72 L 39.5 72.5 Z" fill="#704323" />

    <!-- Satchel Bag (Resting on right hip) -->
    <path d="M 32 72 L 46 72 L 44 86 L 30 86 Z" fill="#704323" />
    <path d="M 32 72 L 46 72 L 48 80 L 34 82 Z" fill="#8b562d" />
    <path d="M 30 86 L 34 82 L 32 72 L 28 76 Z" fill="#472b17" />
    
    <!-- Bag Details -->
    <path d="M 40 78 L 42 77 L 41 81 L 39 82 Z" fill="#f6d365" />
    <path d="M 35 84 L 43 84 L 42 85 L 34 85 Z" fill="#472b17" />
  </g>

  <!-- Head Anchor -->
  <g id="head" transform="rotate(0, 32, 42)">
    <!-- Scarf Tails (Blowing in wind) -->
    <path d="M 22 44 C 14 46, 8 52, 10 58 C 14 54, 18 52, 22 48 Z" fill="#d4a347" />
    <path d="M 24 45 C 16 48, 12 55, 14 60 C 18 56, 20 54, 24 48 Z" fill="#e5b758" />

    <!-- Outer Hood Silhouette -->
    <path d="M 32 8 C 12 12, 12 38, 22 46 L 42 46 C 48 40, 48 20, 32 8 Z" fill="#498f3f" />
    <path d="M 32 8 C 18 12, 16 35, 24 46 L 32 46 C 30 35, 30 15, 32 8 Z" fill="#3a7332" />
    
    <!-- Forehead Star Decal (Side perspective) -->
    <polygon points="22,18 24,20 22,22 20,20" fill="#f6d365" />
    <polygon points="22.5,18.5 24,20 22.5,21.5 21,20" fill="#ffffff" opacity="0.8" />

    <!-- Inner Hood Shadow -->
    <path d="M 28 20 C 38 20, 44 26, 42 40 L 26 40 C 24 30, 24 24, 28 20 Z" fill="#1c3818" />

    <!-- Face Profile -->
    <path d="M 30 22 C 38 22, 42 26, 42 32 C 42 38, 38 42, 30 42 Z" fill="#ffceb4" />
    <path d="M 36 22 C 40 24, 42 28, 42 32 C 42 36, 40 40, 36 42 Z" fill="#eeb596" />
    <path d="M 41 28 L 43 30 L 41 32 Z" fill="#ffceb4" />

    <!-- Hair (Swept to the right) -->
    <path d="M 28 22 L 38 24 L 35 28 L 30 26 Z" fill="#3a2818" />
    <path d="M 30 26 L 32 34 L 28 32 Z" fill="#261a0f" />
    <path d="M 27 21 L 34 23 L 32 26 Z" fill="#523922" />

    <!-- Eye & Cheek (Side view) -->
    <circle cx="36" cy="28" r="1.5" fill="#1a120c" />
    <circle cx="36.5" cy="27.5" r="0.5" fill="#ffffff" />
    <ellipse cx="34" cy="31" rx="2" ry="1" fill="#ffaa99" opacity="0.7" />
    
    <!-- Scarf Neck Wrap -->
    <path d="M 20 42 L 44 42 L 42 48 L 22 48 Z" fill="#e5b758" />
    <path d="M 20 44 L 42 44 L 40 48 L 22 48 Z" fill="#d4a347" />
  </g>

  <!-- Right Arm (Foreground) -->
  <g id="right-arm" transform="rotate(0, 32, 48)">
    <!-- Sleeve Base -->
    <path d="M 32 48 C 38 58, 38 68, 36 78 L 30 76 C 30 66, 30 55, 28 50 Z" fill="#498f3f" />
    <!-- Sleeve Volume Highlight -->
    <path d="M 32 48 C 38 58, 38 68, 36 78 L 33 77 C 35 67, 35 57, 30 49 Z" fill="#58a34d" />
    <!-- Cuff -->
    <path d="M 36 78 L 30 76 L 29 79 L 35 81 Z" fill="#f6d365" />
    <path d="M 36 78 L 33 77 L 32 80 L 35 81 Z" fill="#ffffff" opacity="0.4" />
    <!-- Hand -->
    <circle cx="32" cy="82.5" r="3" fill="#ffceb4" />
    <circle cx="31.5" cy="82.5" r="2.5" fill="#eeb596" />
  </g>
</svg>
