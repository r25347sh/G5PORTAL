<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 128" width="100%" height="100%">
  <!-- Left Leg -->
  <g id="left-leg" transform="rotate(0, 24, 85)">
    <!-- Trousers Base -->
    <path d="M 20 85 L 28 85 L 27 103 L 21 103 Z" fill="#2c323f" />
    <path d="M 24 85 L 28 85 L 27 103 L 24 103 Z" fill="#1f232c" />
    <!-- Trouser Cuff -->
    <path d="M 19 103 L 29 103 L 28 106 L 20 106 Z" fill="#4a5568" />
    <!-- Boot -->
    <path d="M 20 106 L 28 106 L 29 116 L 31 122 L 17 122 L 18 116 Z" fill="#472b17" />
    <path d="M 24 106 L 28 106 L 29 116 L 31 122 L 24 122 Z" fill="#362010" />
    <!-- Boot Accents -->
    <path d="M 19 114 L 29 114 L 29 115 L 18.5 115 Z" fill="#d4a347" />
    <path d="M 17 122 L 31 122 L 30 124 L 18 124 Z" fill="#26160b" />
  </g>

  <!-- Right Leg -->
  <g id="right-leg" transform="rotate(0, 40, 85)">
    <!-- Trousers Base -->
    <path d="M 36 85 L 44 85 L 43 103 L 37 103 Z" fill="#2c323f" />
    <path d="M 40 85 L 44 85 L 43 103 L 40 103 Z" fill="#1f232c" />
    <!-- Trouser Cuff -->
    <path d="M 35 103 L 45 103 L 44 106 L 36 106 Z" fill="#4a5568" />
    <!-- Boot -->
    <path d="M 36 106 L 44 106 L 45 116 L 47 122 L 33 122 L 34 116 Z" fill="#472b17" />
    <path d="M 40 106 L 44 106 L 45 116 L 47 122 L 40 122 Z" fill="#362010" />
    <!-- Boot Accents -->
    <path d="M 35 114 L 45 114 L 45 115 L 34.5 115 Z" fill="#d4a347" />
    <path d="M 33 122 L 47 122 L 46 124 L 34 124 Z" fill="#26160b" />
  </g>

  <!-- Torso Anchor -->
  <g id="torso">
    <!-- Inner Shadow Tunic (covers leg joints) -->
    <path d="M 18 80 L 46 80 L 42 95 L 32 100 L 22 95 Z" fill="#1a2620" />
    <path d="M 32 80 L 46 80 L 42 95 L 32 100 Z" fill="#101814" />
    
    <!-- Layered Poncho / Cloak -->
    <path d="M 32 45 L 14 70 L 32 95 Z" fill="#498f3f" />
    <path d="M 32 45 L 50 70 L 32 95 Z" fill="#3a7332" />
    
    <!-- Poncho Geometric Folds & Trim -->
    <path d="M 14 70 L 16 73 L 32 95 L 32 91 Z" fill="#f6d365" />
    <path d="M 50 70 L 48 73 L 32 95 L 32 91 Z" fill="#d4a347" />
    <polygon points="32,60 33.5,63 32,66 30.5,63" fill="#f6d365" />
    <polygon points="32,68 33,70 32,72 31,70" fill="#f6d365" />

    <!-- Satchel Strap -->
    <path d="M 22 45 L 25 45 L 48 80 L 45 82 Z" fill="#59341b" />
    <path d="M 22 45 L 23.5 45 L 46.5 80 L 45 82 Z" fill="#704323" />
    <polygon points="26,49 28,52 26.5,53 24.5,50" fill="#e5b758" />

    <!-- Satchel Bag -->
    <path d="M 42 76 L 56 76 L 54 90 L 40 90 Z" fill="#704323" />
    <path d="M 56 76 L 58 74 L 56 88 L 54 90 Z" fill="#472b17" />
    <path d="M 42 76 L 58 74 L 60 84 L 44 86 Z" fill="#8b562d" />
    <path d="M 50 75 L 58 74 L 60 84 L 52 85 Z" fill="#704323" />
    
    <!-- Satchel Details (Buckle & Stitching) -->
    <path d="M 49 83 L 53 82 L 52 86 L 48 87 Z" fill="#f6d365" />
    <path d="M 50 84 L 52 83.5 L 51.5 85 L 49.5 85.5 Z" fill="#8b562d" />
    <line x1="43.5" y1="77.5" x2="55.5" y2="75.5" stroke="#472b17" stroke-width="0.5" stroke-dasharray="1 1" />
  </g>

  <!-- Left Arm -->
  <g id="left-arm" transform="rotate(0, 22, 48)">
    <!-- Sleeve Layers -->
    <path d="M 22 48 C 14 55, 12 65, 14 78 L 17 76 C 18 66, 21 55, 24 50 Z" fill="#498f3f" />
    <path d="M 24 50 C 21 55, 18 66, 17 76 L 20 74 C 22 64, 25 53, 26 49 Z" fill="#3a7332" />
    <!-- Cuff -->
    <path d="M 14 78 L 20 74 L 21 77 L 15 81 Z" fill="#f6d365" />
    <!-- Hand -->
    <path d="M 15.5 81 C 15 85, 19 85, 19.5 80 Z" fill="#ffceb4" />
    <path d="M 17.5 80 C 17 84, 19 85, 19.5 80 Z" fill="#eeb596" />
  </g>

  <!-- Right Arm -->
  <g id="right-arm" transform="rotate(0, 42, 48)">
    <!-- Sleeve Layers -->
    <path d="M 42 48 C 50 55, 54 65, 52 78 L 48 77 C 48 66, 44 55, 41 50 Z" fill="#498f3f" />
    <path d="M 41 50 C 44 55, 48 66, 48 77 L 44 75 C 43 64, 39 53, 38 50 Z" fill="#3a7332" />
    <!-- Cuff -->
    <path d="M 52 78 L 44 75 L 43 78 L 51 81 Z" fill="#d4a347" />
    <!-- Hand -->
    <path d="M 50.5 81 C 51 85, 46 86, 44.5 81 Z" fill="#ffceb4" />
    <path d="M 46.5 80 C 47 84, 45 85, 44.5 80 Z" fill="#eeb596" />
  </g>

  <!-- Head Anchor -->
  <g id="head" transform="rotate(0, 32, 42)">
    <!-- Back Outer Hood -->
    <path d="M 32 8 C 18 16, 14 28, 16 44 L 32 44 Z" fill="#498f3f" />
    <path d="M 32 8 C 46 16, 50 28, 48 44 L 32 44 Z" fill="#2d5a27" />
    
    <!-- Hood Accent Lines -->
    <path d="M 18 42 C 16 32, 20 20, 32 10" fill="none" stroke="#f6d365" stroke-width="0.5" opacity="0.6"/>
    <path d="M 46 42 C 48 32, 44 20, 32 10" fill="none" stroke="#d4a347" stroke-width="0.5" opacity="0.6"/>

    <!-- Inner Hood Shadow -->
    <path d="M 32 14 C 22 20, 20 28, 22 42 L 32 42 Z" fill="#1c3818" />
    <path d="M 32 14 C 42 20, 44 28, 42 42 L 32 42 Z" fill="#12240f" />

    <!-- Forehead Decal (Glowing Star) -->
    <polygon points="32,16 34,19 32,22 30,19" fill="#ffffff" opacity="0.8" />
    <polygon points="32,18 33,19 32,20 31,19" fill="#f6d365" />

    <!-- Face Base -->
    <path d="M 26 24 L 32 24 L 32 44 C 26 44, 25 36, 26 24 Z" fill="#ffceb4" />
    <path d="M 38 24 L 32 24 L 32 44 C 38 44, 39 36, 38 24 Z" fill="#eeb596" />

    <!-- Detailed Hair Bangs -->
    <path d="M 25 24 L 31 31 L 32 24 Z" fill="#3a2818" />
    <path d="M 25 24 L 27 33 L 29 24 Z" fill="#3a2818" />
    <path d="M 39 24 L 33 30 L 32 24 Z" fill="#261a0f" />
    <path d="M 39 24 L 37 32 L 35 24 Z" fill="#261a0f" />

    <!-- Facial Features -->
    <circle cx="28.5" cy="34" r="1.5" fill="#1a120c" />
    <circle cx="28.2" cy="33.7" r="0.5" fill="#ffffff" />
    
    <circle cx="35.5" cy="34" r="1.5" fill="#1a120c" />
    <circle cx="35.2" cy="33.7" r="0.5" fill="#ffffff" />
    
    <ellipse cx="27" cy="36.5" rx="1.5" ry="1" fill="#ffaa99" opacity="0.7" />
    <ellipse cx="37" cy="36.5" rx="1.5" ry="1" fill="#e5998a" opacity="0.7" />
    
    <polygon points="32,36 32.5,37 31.5,37" fill="#d99980" />

    <!-- Wrap / Scarf (Covers Neck Pivot Seam cleanly) -->
    <path d="M 20 44 L 44 44 L 32 54 Z" fill="#e5b758" />
    <path d="M 32 44 L 44 44 L 32 54 Z" fill="#d4a347" />
    <path d="M 22 42 L 42 42 L 44 46 L 20 46 Z" fill="#f6d365" />
    <path d="M 32 42 L 42 42 L 44 46 L 32 46 Z" fill="#d4a347" />
  </g>
</svg>
