<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 128" width="100%" height="100%">
  <!-- Left Arm (Background) - Reaching forward to hold broom -->
  <g id="left-arm" transform="rotate(0, 32, 52)">
    <!-- Sleeve -->
    <path d="M 32 52 L 48 64 L 45 68 L 30 58 Z" fill="#1c3818" />
    <path d="M 32 52 L 48 64 L 47 66 L 31 56 Z" fill="#2d5a27" />
    <!-- Cuff -->
    <path d="M 48 64 L 45 68 L 47 70 L 50 66 Z" fill="#b8862d" />
    <!-- Hand -->
    <circle cx="49" cy="67" r="2.5" fill="#d99980" />
  </g>

  <!-- Left Leg (Background) - Tucked back slightly -->
  <g id="left-leg" transform="rotate(0, 32, 72)">
    <!-- Thigh & Knee -->
    <path d="M 32 72 L 38 72 L 35 84 L 28 84 Z" fill="#1f232c" />
    <!-- Calf -->
    <path d="M 35 84 L 28 84 L 22 92 L 28 94 Z" fill="#15181f" />
    <!-- Boot -->
    <path d="M 22 92 L 28 94 L 25 102 L 19 100 Z" fill="#26160b" />
    <path d="M 19 100 L 25 102 L 26 104 L 18 102 Z" fill="#1a0f07" />
  </g>

  <!-- Magical Broom -->
  <g id="broom">
    <!-- Magic Sparkles -->
    <polygon points="4,106 6,108 4,110 2,108" fill="#f6d365" />
    <polygon points="10,110 11,112 10,114 9,112" fill="#ffffff" opacity="0.8" />
    <polygon points="8,98 9,99 8,100 7,99" fill="#f6d365" />
    
    <!-- Broom Tail / Bristles Base -->
    <polygon points="13,87 14,91 6,95 2,92 5,85" fill="#e5b758" />
    <polygon points="6,95 2,92 4,102 12,106 14,91" fill="#d4a347" />
    <polygon points="14,91 12,106 15,102 16,92" fill="#b8862d" />
    
    <!-- Broom Handle -->
    <polygon points="12,88 58,62 59,64 13,90" fill="#704323" />
    <polygon points="12,88 58,62 58.5,63 12.5,89" fill="#8b562d" />
    
    <!-- Broom String/Binding -->
    <polygon points="13,86 15,91 17,90 15,85" fill="#f6d365" />
    <polygon points="14,87 15,90 16,89.5 15,86.5" fill="#ffffff" opacity="0.5" />
  </g>

  <!-- Torso Anchor - Leaning forward, clothes blowing back -->
  <g id="torso">
    <!-- Base Inner Shadow -->
    <path d="M 28 70 L 40 70 L 35 78 L 26 78 Z" fill="#101814" />
    
    <!-- Poncho Flying Backwards -->
    <path d="M 34 52 L 44 75 L 18 68 Z" fill="#498f3f" />
    <path d="M 34 52 L 28 72 L 18 68 Z" fill="#3a7332" />
    <path d="M 28 72 L 44 75 L 36 70 Z" fill="#58a34d" />
    
    <!-- Poncho Trim (Gold) -->
    <path d="M 18 68 L 44 75 L 43 73 L 19 66 Z" fill="#f6d365" />
    
    <!-- Satchel Strap (Pulled by wind) -->
    <path d="M 34 52 L 36 53 L 22 73 L 20 72 Z" fill="#59341b" />
    <path d="M 34.5 52 L 36 53 L 22 73 L 20.5 72 Z" fill="#704323" />
    
    <!-- Satchel Bag (Flying back/down) -->
    <path d="M 8 78 L 22 72 L 20 84 L 6 90 Z" fill="#704323" />
    <path d="M 8 78 L 22 72 L 24 78 L 10 84 Z" fill="#8b562d" />
    <path d="M 6 90 L 20 84 L 22 72 L 21 73 L 7 91 Z" fill="#472b17" />
    
    <!-- Bag Details -->
    <polygon points="14,79 16,78 15,81 13,82" fill="#f6d365" />
    <polygon points="14.5,79.5 15.5,79 15,80.5 14,81" fill="#8b562d" />
  </g>

  <!-- Right Leg (Foreground) - Angled over the broom -->
  <g id="right-leg" transform="rotate(0, 32, 72)">
    <!-- Thigh -->
    <path d="M 30 70 L 38 72 L 42 82 L 34 82 Z" fill="#2c323f" />
    <path d="M 30 70 L 34 71 L 38 82 L 34 82 Z" fill="#384252" />
    <!-- Calf -->
    <path d="M 42 82 L 34 82 L 28 95 L 34 98 Z" fill="#1f232c" />
    <!-- Cuff -->
    <path d="M 27 94 L 35 97 L 34 99 L 26 96 Z" fill="#4a5568" />
    <!-- Boot -->
    <path d="M 26 96 L 34 99 L 30 108 L 23 106 Z" fill="#472b17" />
    <path d="M 34 99 L 30 108 L 32 110 L 36 100 Z" fill="#5c3a21" />
    <path d="M 23 106 L 30 108 L 28 112 L 22 109 Z" fill="#26160b" />
    <path d="M 26.5 104 L 33 106 L 33.5 107 L 26 105 Z" fill="#d4a347" />
  </g>

  <!-- Head Anchor - Pushed back by wind, leaning forward -->
  <g id="head" transform="rotate(0, 34, 48)">
    <!-- Streaming Scarf Tails (Wind effect) -->
    <path d="M 32 50 C 20 48, 10 52, 2 50 C 8 54, 18 54, 30 54 Z" fill="#d4a347" />
    <path d="M 30 52 C 18 52, 12 58, 4 56 C 12 60, 20 58, 32 54 Z" fill="#b8862d" />
    
    <!-- Outer Hood (Blown backwards) -->
    <path d="M 38 30 C 20 28, 8 36, 12 48 L 34 52 C 38 52, 42 40, 38 30 Z" fill="#498f3f" />
    <path d="M 38 30 C 28 30, 16 38, 12 48 L 20 50 C 24 42, 32 35, 38 30 Z" fill="#3a7332" />
    
    <!-- Forehead Star (Profile angle) -->
    <polygon points="40,32 42,34 40,36 38,34" fill="#f6d365" />
    <polygon points="40,33 41.5,34 40,35 38.5,34" fill="#ffffff" opacity="0.8" />

    <!-- Face Base -->
    <path d="M 36 34 C 44 34, 46 38, 46 42 C 46 48, 42 50, 36 50 Z" fill="#ffceb4" />
    <path d="M 40 34 C 45 36, 46 40, 46 42 C 46 46, 44 49, 40 50 Z" fill="#eeb596" />

    <!-- Hair (Swept back by wind) -->
    <path d="M 38 34 L 44 36 L 40 40 L 36 36 Z" fill="#3a2818" />
    <path d="M 36 36 L 42 42 L 38 42 Z" fill="#261a0f" />
    <path d="M 34 32 L 40 33 L 38 36 Z" fill="#523922" />

    <!-- Eye & Cheek -->
    <circle cx="42" cy="40" r="1.5" fill="#1a120c" />
    <circle cx="42.5" cy="39.5" r="0.5" fill="#ffffff" />
    <ellipse cx="40" cy="43" rx="2" ry="1" fill="#ffaa99" opacity="0.7" />

    <!-- Scarf Neck Wrap -->
    <path d="M 32 48 L 44 48 L 42 54 L 30 54 Z" fill="#e5b758" />
    <path d="M 32 50 L 42 50 L 40 54 L 30 54 Z" fill="#d4a347" />
  </g>

  <!-- Right Arm (Foreground) - Holding broom tightly -->
  <g id="right-arm" transform="rotate(0, 34, 54)">
    <!-- Flowing Sleeve -->
    <path d="M 34 54 L 42 68 L 34 74 L 28 62 Z" fill="#498f3f" />
    <!-- Sleeve Highlight -->
    <path d="M 34 54 L 42 68 L 38 70 L 30 58 Z" fill="#58a34d" />
    <!-- Cuff -->
    <path d="M 42 68 L 34 74 L 36 76 L 44 70 Z" fill="#f6d365" />
    <!-- Hand -->
    <circle cx="43.5" cy="70" r="3" fill="#ffceb4" />
    <circle cx="43" cy="70" r="2.5" fill="#eeb596" />
  </g>
</svg>
