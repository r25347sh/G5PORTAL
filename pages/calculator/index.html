<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>電卓 · G⁵ Portal</title>
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../MENU/MENU.css">
  <script src="../../src/js/main.js" defer></script>
  <script src="../../MENU/MENU.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>
  <header class="tool-header">
    <a href="../../index.html" class="btn btn-ghost tool-back">← G⁵ Portal</a>
    <h1>電卓</h1>
    <p class="tool-sub">四則演算 · パーセント · 符号反転 · 履歴</p>
  </header>
  <main class="tool-main">
    <div class="calc-shell tool-card">
      <div class="calc-display" aria-live="polite">
        <div id="expr" class="calc-expr"></div>
        <div id="display" class="calc-value">0</div>
      </div>
      <div class="calc-keys" role="group" aria-label="電卓キー">
        <button type="button" class="key key-fn" data-action="clear">AC</button>
        <button type="button" class="key key-fn" data-action="sign">±</button>
        <button type="button" class="key key-fn" data-action="percent">%</button>
        <button type="button" class="key key-op" data-op="/">÷</button>
        <button type="button" class="key key-num" data-num="7">7</button>
        <button type="button" class="key key-num" data-num="8">8</button>
        <button type="button" class="key key-num" data-num="9">9</button>
        <button type="button" class="key key-op" data-op="*">×</button>
        <button type="button" class="key key-num" data-num="4">4</button>
        <button type="button" class="key key-num" data-num="5">5</button>
        <button type="button" class="key key-num" data-num="6">6</button>
        <button type="button" class="key key-op" data-op="-">−</button>
        <button type="button" class="key key-num" data-num="1">1</button>
        <button type="button" class="key key-num" data-num="2">2</button>
        <button type="button" class="key key-num" data-num="3">3</button>
        <button type="button" class="key key-op" data-op="+">+</button>
        <button type="button" class="key key-num key-zero" data-num="0">0</button>
        <button type="button" class="key key-num" data-action="dot">.</button>
        <button type="button" class="key key-eq" data-action="equals">=</button>
      </div>
    </div>
    <div class="history-card tool-card">
      <div class="history-head">
        <h2>履歴</h2>
        <button type="button" id="btn-clear-history" class="btn btn-ghost">クリア</button>
      </div>
      <ul id="history" class="history-list" aria-live="polite"></ul>
      <p id="history-empty" class="hint">計算結果がここに表示されます</p>
    </div>
    <p id="toast" class="toast hidden" role="status"></p>
  </main>
  <footer class="site-footer">
    <p><strong>G⁵ Portal</strong> · 電卓</p>
    <p>© 2026 Reitaku H.S. 5G</p>
  </footer>
</body>
</html>
