<!DOCTYPE html>
<html lang="ja" data-color-mode="dark" data-color-scheme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>PDFビューアー · G⁵ Portal</title>
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="style.css?v=20261007c">
  <link rel="stylesheet" href="../../MENU/MENU.css">
</head>
<body class="pdf-body">
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>

  <header class="pdf-toolbar" id="pdf-toolbar">
    <div class="tb-left">
      <a href="../../index.html" class="btn btn-ghost btn-sm" title="ホーム">←</a>
      <button type="button" id="btn-open" class="btn btn-ghost btn-sm" title="開く">📂 開く</button>
      <input type="file" id="file-input" class="file-input-hidden" accept=".pdf,application/pdf" tabindex="-1" aria-hidden="true">
      <span class="pdf-title" id="pdf-title">PDFビューアー</span>
    </div>
    <div class="tb-center">
      <button type="button" id="btn-prev" class="btn btn-ghost btn-sm" title="前のページ (←)" disabled>◀</button>
      <span class="page-info">
        <input type="number" id="page-num" min="1" value="1" class="page-input" disabled title="ページ番号">
        <span>/</span>
        <span id="page-count">–</span>
      </span>
      <button type="button" id="btn-next" class="btn btn-ghost btn-sm" title="次のページ (→)" disabled>▶</button>
    </div>
    <div class="tb-right">
      <button type="button" id="btn-zoom-out" class="btn btn-ghost btn-sm" title="縮小 (−)" disabled>−</button>
      <select id="zoom-select" class="zoom-select" disabled title="表示倍率">
        <option value="auto">自動</option>
        <option value="page-width">幅に合わせる</option>
        <option value="page-fit">ページ全体</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
      </select>
      <button type="button" id="btn-zoom-in" class="btn btn-ghost btn-sm" title="拡大 (+)" disabled>＋</button>
      <button type="button" id="btn-rotate" class="btn btn-ghost btn-sm" title="回転 (R)" disabled>⟳</button>
      <button type="button" id="btn-search" class="btn btn-ghost btn-sm" title="検索 (Ctrl+F)" disabled>🔍</button>
      <button type="button" id="btn-sidebar" class="btn btn-ghost btn-sm" title="サイドバー" disabled>☰</button>
      <button type="button" id="btn-layout" class="btn btn-ghost btn-sm" title="見開き切替" disabled>📑</button>
      <button type="button" id="btn-invert" class="btn btn-ghost btn-sm" title="反転表示 (I)" disabled>◐</button>
      <button type="button" id="btn-present" class="btn btn-ghost btn-sm" title="プレゼン (F)" disabled>▶</button>
      <button type="button" id="btn-fullscreen" class="btn btn-ghost btn-sm" title="全画面">⛶</button>
      <a id="btn-download" class="btn btn-ghost btn-sm hidden" title="ダウンロード" download>⬇</a>
      <button type="button" id="btn-print" class="btn btn-ghost btn-sm" title="印刷 (Ctrl+P)" disabled>🖨</button>
    </div>
  </header>

  <div class="search-bar hidden" id="search-bar">
    <input type="search" id="search-input" placeholder="テキストを検索…" autocomplete="off">
    <span class="search-count" id="search-count"></span>
    <button type="button" id="search-prev" class="btn btn-ghost btn-sm" title="前の結果">↑</button>
    <button type="button" id="search-next" class="btn btn-ghost btn-sm" title="次の結果">↓</button>
    <button type="button" id="search-close" class="btn btn-ghost btn-sm" title="閉じる">×</button>
  </div>

  <div class="progress-track" id="progress-track" aria-hidden="true">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div class="pdf-layout">
    <aside class="pdf-sidebar hidden" id="pdf-sidebar">
      <div class="sidebar-tabs">
        <button type="button" class="sidebar-tab active" data-panel="thumbs">サムネ</button>
        <button type="button" class="sidebar-tab" data-panel="outline">目次</button>
        <button type="button" class="sidebar-tab" data-panel="info">情報</button>
      </div>
      <div class="sidebar-panel" id="thumbs-panel"></div>
      <div class="sidebar-panel hidden" id="outline-panel"></div>
      <div class="sidebar-panel hidden" id="info-panel"></div>
    </aside>

    <main class="pdf-viewer" id="pdf-viewer">
      <div class="drop-zone" id="drop-zone">
        <div class="drop-inner">
          <div class="drop-icon">📄</div>
          <h2>PDFを開く</h2>
          <p>ファイルをドロップ、または「開く」ボタン<br>
            閲覧専用 · 高速レンダリング · 検索 · 見開き · プレゼン対応</p>
          <button type="button" class="btn btn-primary" id="btn-open-main">ファイルを選択</button>
          <label for="file-input" class="btn btn-ghost btn-sm file-label" id="btn-open-label">またはここをタップ</label>
          <p class="drop-hints">← → ページ / + − ズーム / Ctrl+F 検索 / F プレゼン / R 回転 / I 反転</p>
        </div>
      </div>
      <div class="pages-container" id="pages-container"></div>
    </main>
  </div>

  <div class="status-bar" id="status-bar">
    <span id="status-text">準備完了 · 閲覧専用</span>
    <span id="view-status" class="view-status"></span>
  </div>

  <div class="present-overlay hidden" id="present-overlay">
    <div class="present-stage" id="present-stage"></div>
    <div class="present-chrome">
      <span id="present-page-label">1 / 1</span>
      <button type="button" id="present-exit" class="btn btn-ghost btn-sm">Esc 終了</button>
    </div>
  </div>

  <script src="../../src/js/main.js"></script>
  <script src="../../MENU/MENU.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
  <script src="script.js?v=20261007c"></script>
</body>
</html>
