<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>デジタル時計 · G⁵ Portal</title>
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../MENU/MENU.css">
  <script src="../../src/js/main.js" defer></script>
  <script src="../../MENU/MENU.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>
  <header class="tool-header">
    <a href="../../index.html" class="btn btn-ghost tool-back">← G⁵ Portal</a>
    <h1>デジタル時計</h1>
    <p class="tool-sub">高分解能表示 · performance.now 同期</p>
  </header>
  <main class="tool-main">
    <div class="clock-stage">
      <div class="date-line" id="date-line">—</div>
      <div class="time-main" id="time-main" aria-live="polite">
        <span id="hms">00:00:00</span><span class="frac">.<span id="ms">000</span></span>
      </div>
      <div class="time-nano" id="time-nano">
        <span class="nano-label">μs</span>
        <span id="us">000</span>
        <span class="nano-label">ns*</span>
        <span id="ns">000</span>
      </div>
      <div class="epoch-line" id="epoch-line">Unix ms: —</div>
    </div>
    <section class="tool-card">
      <div class="opt-grid">
        <label class="toggle"><input type="checkbox" id="opt-24h" checked><span>24時間表示</span></label>
        <label class="toggle"><input type="checkbox" id="opt-ms" checked><span>ミリ秒</span></label>
        <label class="toggle"><input type="checkbox" id="opt-us" checked><span>マイクロ / ナノ表示</span></label>
        <label class="toggle"><input type="checkbox" id="opt-pulse" checked><span>秒パルス</span></label>
      </div>
      <div class="tool-actions">
        <button type="button" id="btn-copy" class="btn btn-primary">時刻をコピー</button>
        <button type="button" id="btn-sync" class="btn btn-ghost">再同期</button>
      </div>
      <p class="precision-note">
        * ブラウザのタイマー分解能には上限があります（多くの環境で数 μs〜数十 μs）。
        表示上の ns は <code>performance.now()</code> の小数部から補間したもので、
        ハードウェアの真の 1 ns 精度ではありません。
      </p>
    </section>
    <p id="toast" class="toast hidden" role="status"></p>
  </main>
  <footer class="site-footer"><p><strong>G⁵ Portal</strong> · Clock</p></footer>
</body>
</html>
