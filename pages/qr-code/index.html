<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>QRコード · G⁵ Portal</title>
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../MENU/MENU.css">
  <script src="../../src/js/main.js" defer></script>
  <script src="../../MENU/MENU.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
  <script src="script.js" defer></script>
  <script src="maze.js" defer></script>
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>
  <header class="tool-header">
    <a href="../../index.html" class="btn btn-ghost tool-back">← G⁵ Portal</a>
    <h1>QRコード</h1>
    <p class="tool-sub">作成 · 読み取り · エクスポート</p>
  </header>
  <main class="tool-main">
    <div class="mode-tabs" role="tablist">
      <button type="button" class="mode-tab active" data-mode="create" role="tab" aria-selected="true">作成</button>
      <button type="button" class="mode-tab" data-mode="read" role="tab" aria-selected="false">読み取り</button>
    </div>
    <div id="panel-create" class="tool-card">
      <label class="field-label" for="qr-text">テキスト / URL</label>
      <textarea id="qr-text" rows="3" placeholder="https://… または任意のテキスト"></textarea>
      <div class="row-opts">
        <label>サイズ <span id="size-val">200</span>px
          <input type="range" id="qr-size" min="120" max="400" value="200">
        </label>
        <label>前景 <input type="color" id="qr-fg" value="#000000"></label>
        <label>背景 <input type="color" id="qr-bg" value="#ffffff"></label>
      </div>
      <div class="btn-row">
        <button type="button" id="btn-gen" class="btn btn-primary">生成</button>
        <button type="button" id="btn-export" class="btn btn-ghost" disabled>PNG保存</button>
      </div>
      <div id="qr-out" class="qr-out" aria-live="polite"></div>
    </div>
    <div id="panel-read" class="tool-card hidden">
      <video id="cam" playsinline muted class="cam-view"></video>
      <canvas id="scan-canvas" class="hidden"></canvas>
      <div class="btn-row">
        <button type="button" id="btn-cam" class="btn btn-primary">カメラ開始</button>
        <button type="button" id="btn-cam-stop" class="btn btn-ghost">停止</button>
      </div>
      <p id="scan-result" class="scan-result"></p>
    </div>
    <p id="toast" class="toast hidden" role="status"></p>
  </main>
  <footer class="site-footer">
    <p><strong>G⁵ Portal</strong> · QRコード</p>
    <p>© 2026 Reitaku H.S. 5G</p>
  </footer>
</body>
</html>
