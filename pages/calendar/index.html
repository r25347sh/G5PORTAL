<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <meta name="description" content="G⁵ Portal カレンダー · Google Calendar 連携">
  <title>カレンダー · G⁵ Portal</title>
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../MENU/MENU.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
  <script src="../../src/js/main.js" defer></script>
  <script src="../../MENU/MENU.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>
  <header class="tool-header">
    <a href="../../index.html" class="btn btn-ghost tool-back">← G⁵ Portal</a>
    <h1>カレンダー</h1>
    <p class="tool-sub">G5PORTAL · Google Calendar 同期</p>
  </header>
  <main class="tool-main cal-main">
    <div class="cal-toolbar tool-card">
      <div class="cal-status" id="cal-status">読み込み中…</div>
      <div class="cal-actions">
        <button type="button" id="btn-refresh" class="btn btn-ghost" title="再読み込み">↻ 更新</button>
        <button type="button" id="btn-today" class="btn btn-primary">今日</button>
      </div>
    </div>
    <div id="calendar" class="fc-g5"></div>
    <section class="tool-card cal-legend">
      <p class="hint">
        イベントは Google カレンダー（G5PORTAL）から取得します。
        クリックで詳細を表示。更新は自動キャッシュ + 手動リフレッシュ対応。
      </p>
    </section>
    <p id="toast" class="toast hidden" role="status"></p>
  </main>
  <footer class="site-footer"><p><strong>G⁵ Portal</strong> · Calendar</p></footer>
</body>
</html>
