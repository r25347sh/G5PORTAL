<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <meta name="description" content="G5 Portal calendar">
  <title>カレンダー · G5 Portal</title>
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="style.css?v=20261007h">
  <link rel="stylesheet" href="../../MENU/MENU.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>
  <header class="tool-header">
    <a href="../../index.html" class="btn btn-ghost tool-back">← G5 Portal</a>
    <h1>カレンダー</h1>
    <p class="tool-sub">G5PORTAL · Google Calendar 同期（約1時間ごと自動）</p>
  </header>
  <main class="tool-main cal-main">
    <div class="cal-toolbar tool-card">
      <div class="cal-status" id="cal-status">読み込み中…</div>
      <div class="cal-actions">
        <button type="button" id="btn-refresh" class="btn btn-ghost" title="refresh">↻ 更新</button>
        <button type="button" id="btn-today" class="btn btn-primary">今日</button>
      </div>
    </div>
    <div id="calendar" class="fc-g5"></div>
    <section class="tool-card cal-legend">
      <div class="cal-legend-row">
        <span class="cal-legend-item"><span class="cal-legend-swatch cal-legend-swatch--default"></span>一般</span>
        <span class="cal-legend-item"><span class="cal-legend-swatch cal-legend-swatch--ctb"></span>CTB</span>
        <span class="cal-legend-item"><span class="cal-legend-swatch cal-legend-swatch--exam"></span>試験</span>
        <span class="cal-legend-item"><span class="cal-legend-swatch cal-legend-swatch--ceremony"></span>式典</span>
        <span class="cal-legend-item"><span class="cal-legend-swatch cal-legend-swatch--holiday"></span>休業（祝日・休校など）</span>
      </div>
      <p class="hint">
        Google カレンダー（G5PORTAL）の内容を GitHub Actions が約1時間ごとに同期します。「更新」で最新の同期データを再取得します。
      </p>
    </section>
    <p id="toast" class="toast hidden" role="status"></p>
  </main>
  <footer class="site-footer"><p><strong>G5 Portal</strong> · Calendar</p></footer>

  <script src="../../src/js/main.js"></script>
  <script src="../../MENU/MENU.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/ja.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <script src="script.js?v=20261007h"></script>
</body>
</html>
