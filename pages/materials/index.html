<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>副教材 · G⁵ Portal</title>
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../MENU/MENU.css">
  <script src="../../src/js/main.js" defer></script>
  <script src="../../MENU/MENU.js" defer></script>
  <script src="materials.js" defer></script>
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>
  <header class="tool-header">
    <a href="../../index.html" class="btn btn-ghost tool-back">← G⁵ Portal</a>
    <h1>副教材</h1>
    <p class="tool-sub">勉強用 PDF・画像・動画・音声の配信スペース</p>
  </header>
  <main class="tool-main">
    <div class="view-toolbar">
      <div class="view-tabs" role="tablist" aria-label="表示切替">
        <button type="button" class="view-tab active" data-view="list" role="tab" aria-selected="true">リスト</button>
        <button type="button" class="view-tab" data-view="gallery" role="tab" aria-selected="false">ギャラリー</button>
      </div>
      <p class="file-count" id="file-count"></p>
    </div>

    <div id="list-view" class="materials-list" role="tabpanel"></div>
    <div id="gallery-view" class="materials-gallery hidden" role="tabpanel"></div>

    <div id="empty-state" class="tool-card empty hidden">
      <div class="empty-icon">◇</div>
      <h2>教材がありません</h2>
      <p>PDF・PNG・MP4・MOV・MP3 などを <code>pages/materials/files/</code> に配置してください。サブフォルダも自動で読み込みます。</p>
    </div>
  </main>

  <div id="preview-modal" class="preview-modal hidden" role="dialog" aria-modal="true" aria-labelledby="preview-title">
    <div class="preview-backdrop" data-close></div>
    <div class="preview-panel">
      <header class="preview-header">
        <h2 id="preview-title" class="preview-title"></h2>
        <div class="preview-actions">
          <a id="preview-download" class="btn btn-ghost btn-sm" download>ダウンロード</a>
          <a id="preview-open" class="btn btn-ghost btn-sm" target="_blank" rel="noopener">新しいタブで開く</a>
          <button type="button" class="btn btn-ghost btn-sm" data-close aria-label="閉じる">×</button>
        </div>
      </header>
      <div class="preview-body" id="preview-body"></div>
    </div>
  </div>

  <footer class="site-footer"><p><strong>G⁵ Portal</strong> · Materials</p></footer>
</body>
</html>
