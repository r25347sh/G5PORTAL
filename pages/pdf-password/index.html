<!DOCTYPE html>
<html lang="ja" data-color-mode="dark" data-color-scheme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFパスワード保護 · G⁵ Portal</title>
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="../../MENU/MENU.css">
  <style>
    .tool-wrap { max-width: 560px; margin: 2rem auto; padding: 0 1rem 3rem; }
    .tool-card {
      background: rgba(16,11,26,0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }
    .tool-card h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
    .tool-card p.desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-muted); }
    .field input[type="password"], .field input[type="text"], .field input[type="file"] {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.95rem;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem; }
    .status { margin-top: 1rem; font-size: 0.85rem; color: var(--cyan); min-height: 1.2em; }
    .file-name { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem; }
    .back { display: inline-block; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>
  <div class="tool-wrap">
    <a href="../../index.html" class="btn btn-ghost btn-sm back">← ホーム</a>
    <div class="tool-card">
      <h1>🔒 PDFパスワード保護</h1>
      <p class="desc">PDFに自分で設定したパスワードをかけます。ブラウザ内で処理し、サーバーには送りません。</p>
      <div class="field">
        <label for="pdf-file">PDFファイル</label>
        <input type="file" id="pdf-file" accept="application/pdf,.pdf">
        <div class="file-name" id="file-name"></div>
      </div>
      <div class="field">
        <label for="user-pass">閲覧パスワード（開くときに必要）</label>
        <input type="password" id="user-pass" autocomplete="new-password" placeholder="任意のパスワード">
      </div>
      <div class="field">
        <label for="owner-pass">所有者パスワード（省略可・空なら閲覧と同じ）</label>
        <input type="password" id="owner-pass" autocomplete="new-password" placeholder="省略可">
      </div>
      <div class="actions">
        <button type="button" id="btn-protect" class="btn btn-primary">パスワードをかけて保存</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>
  <script src="../../src/js/main.js"></script>
  <script src="../../MENU/MENU.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
