<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>カラーピッカー · G⁵ Portal</title>
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../MENU/MENU.css">
  <script src="../../src/js/main.js" defer></script>
  <script src="../../MENU/MENU.js" defer></script>
  <script src="script.js" defer></script>
  <script src="invaders.js" defer></script>
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>
  <header class="tool-header">
    <a href="../../index.html" class="btn btn-ghost tool-back">← G⁵ Portal</a>
    <h1>カラーピッカー</h1>
    <p class="tool-sub">HEX · RGB · HSL · 画像から抽出</p>
  </header>
  <main class="tool-main">
    <div class="tool-card">
      <div id="swatch" class="swatch" title="クリックでコピー"></div>
      <div class="vals">
        <button type="button" class="val-chip" id="v-hex" data-copy>HEX</button>
        <button type="button" class="val-chip" id="v-rgb" data-copy>RGB</button>
        <button type="button" class="val-chip" id="v-hsl" data-copy>HSL</button>
      </div>
      <div class="pick-row">
        <label>色 <input type="color" id="color-input" value="#ff2d95"></label>
        <label>HEX <input type="text" id="hex-input" value="#ff2d95" spellcheck="false"></label>
      </div>
    </div>
    <div class="tool-card">
      <h2>画像から色を取る</h2>
      <input type="file" id="img-file" accept="image/*">
      <canvas id="img-canvas" class="img-canvas"></canvas>
      <p class="hint">画像をクリックしてピクセル色を取得</p>
    </div>
    <p id="toast" class="toast hidden" role="status"></p>
  </main>
  <footer class="site-footer">
    <p><strong>G⁵ Portal</strong> · カラーピッカー</p>
    <p>© 2026 Reitaku H.S. 5G</p>
  </footer>
</body>
</html>
