<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>ログイン · G⁵ Portal</title>
  <link rel="stylesheet" href="src/css/style.css">
  <script src="src/js/main.js" defer></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="src/js/login.js" defer></script>
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>
  <div class="login-wrap">
    <div class="login-panel">
      <div class="login-brand">G⁵ Portal</div>
      <h1>ログイン</h1>
      <p class="muted">ID/パスワード または QR でログイン（asobiseminar 同様）</p>
      <label>ユーザーID
        <input id="uid" autocomplete="username" placeholder="メンバーID">
      </label>
      <label>パスワード
        <input id="pw" type="password" autocomplete="current-password">
      </label>
      <button type="button" id="btn-login" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">ログイン</button>
      <div class="login-or"><span>または</span></div>
      <button type="button" id="btn-qr-login" class="btn btn-ghost" style="width:100%;">📷 QRコードでログイン</button>
      <p class="login-qr-hint">QRの内容は <code>{id,pass}</code> 形式です</p>
      <div id="qr-panel" class="qr-panel hidden">
        <div id="qr-reader" class="qr-reader"></div>
        <div class="qr-actions">
          <button type="button" id="btn-qr-flip" class="btn btn-ghost">🔄 カメラ切替</button>
          <button type="button" id="btn-qr-stop" class="btn btn-ghost">カメラを閉じる</button>
        </div>
      </div>
      <p id="login-msg" class="msg"></p>
      <p style="margin-top:1.5rem;text-align:center;">
        <a href="index.html" class="btn btn-ghost" style="font-size:0.85rem;">トップへ</a>
      </p>
    </div>
  </div>
</body>
</html>
